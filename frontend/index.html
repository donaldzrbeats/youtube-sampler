<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudSampler</title>
  <style>
    body {
      background: #121214;
      color: #fff;
      font-family: sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel {
      width: 100%;
      max-width: 800px;
      background: #1e1e24;
      padding: 24px;
      border-radius: 8px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 16px;
      padding: 12px;
      background: #18181c;
      border-radius: 6px;
      align-items: center;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-group label {
      font-size: 14px;
      color: #aaa;
    }
    .display-val {
      font-weight: bold;
      min-width: 45px;
      color: #00e5ff;
    }
    input[type="text"] {
      width: 60%;
      padding: 10px;
      background: #0f0f11;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
    }
    input[type="range"] {
      accent-color: #00e5ff;
      cursor: pointer;
    }
    button {
      padding: 10px 16px;
      background: #00e5ff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button.small-btn {
      padding: 4px 8px;
      font-size: 12px;
      background: #333;
      color: #fff;
    }
    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
    }
    #waveform {
      width: 100%;
      margin-top: 20px;
      background: #0f0f11;
      border-radius: 4px;
      min-height: 128px;
    }
    .pads-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    .pad {
      height: 80px;
      background: #2a2a32;
      border: 2px solid #3a3a46;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: background 0.05s, border-color 0.05s;
    }
    .pad.active {
      background: #00e5ff;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 12px #00e5ff;
    }
    .pad-key {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .pad.active .pad-key {
      color: #222;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>CloudSampler Web Studio</h2>

    <div class="controls">
      <input type="text" id="yt-url" placeholder="Paste YouTube link..." />
      <button id="load-btn">Extract Audio</button>
      <button id="auto-slice-btn">Auto Find Slices</button>
    </div>

    <!-- Control Toolbar -->
    <div class="toolbar">
      <div class="control-group">
        <label for="volume-slider">Volume:</label>
        <input type="range" id="volume-slider" min="0" max="100" value="80" />
        <span id="volume-display" class="display-val">80%</span>
      </div>

      <div class="control-group">
        <label for="pitch-slider">Pitch:</label>
        <input type="range" id="pitch-slider" min="-12" max="12" step="1" value="0" />
        <span id="pitch-display" class="display-val">0 st</span>
        <button id="reset-pitch-btn" class="small-btn">Reset</button>
      </div>

      <div class="control-group" style="margin-left: auto;">
        <button id="export-btn" disabled>DAW Export (.ZIP)</button>
      </div>
    </div>

    <div id="waveform"></div>

    <div class="pads-grid" id="pads-container">
      <!-- 8 Pads -->
      <div class="pad" data-pad-index="0">Pad 1<span class="pad-key">[Key 1]</span></div>
      <div class="pad" data-pad-index="1">Pad 2<span class="pad-key">[Key 2]</span></div>
      <div class="pad" data-pad-index="2">Pad 3<span class="pad-key">[Key 3]</span></div>
      <div class="pad" data-pad-index="3">Pad 4<span class="pad-key">[Key 4]</span></div>
      <div class="pad" data-pad-index="4">Pad 5<span class="pad-key">[Key 5]</span></div>
      <div class="pad" data-pad-index="5">Pad 6<span class="pad-key">[Key 6]</span></div>
      <div class="pad" data-pad-index="6">Pad 7<span class="pad-key">[Key 7]</span></div>
      <div class="pad" data-pad-index="7">Pad 8<span class="pad-key">[Key 8]</span></div>
    </div>
  </div>

  <script type="module">
    import WaveSurfer from 'wavesurfer.js';
    import RegionsPlugin from 'wavesurfer.js/plugins/regions';
    import { SamplerEngine } from '/src/sampler.js';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sampler = new SamplerEngine(audioCtx);

    const wsRegions = RegionsPlugin.create();
    const wavesurfer = WaveSurfer.create({
      container: '#waveform',
      waveColor: '#4F4F4F',
      progressColor: '#00e5ff',
      plugins: [wsRegions]
    });

    window.wavesurfer = wavesurfer;
    window.sampler = sampler;
    window.wsRegions = wsRegions;

    const exportBtn = document.getElementById('export-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeDisplay = document.getElementById('volume-display');
    const pitchSlider = document.getElementById('pitch-slider');
    const pitchDisplay = document.getElementById('pitch-display');
    const resetPitchBtn = document.getElementById('reset-pitch-btn');
    const autoSliceBtn = document.getElementById('auto-slice-btn');
    const padElements = document.querySelectorAll('.pad');

    // Initial setup
    sampler.setVolume(volumeSlider.value / 100);

    // Volume Slider Control
    volumeSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      volumeDisplay.textContent = `${val}%`;
      sampler.setVolume(val / 100);
    });

    // Pitch Slider Control
    const updatePitchUI = (semitones) => {
      pitchSlider.value = semitones;
      sampler.setPitch(semitones);
      const sign = semitones > 0 ? '+' : '';
      pitchDisplay.textContent = `${sign}${semitones} st`;
    };

    pitchSlider.addEventListener('input', (e) => {
      const semitones = parseInt(e.target.value, 10);
      updatePitchUI(semitones);
    });

    resetPitchBtn.addEventListener('click', () => {
      updatePitchUI(0);
    });

    // DAW Export
    exportBtn.addEventListener('click', async () => {
      if (!sampler.buffer || sampler.slices.length === 0) return;
      try {
        exportBtn.disabled = true;
        exportBtn.textContent = 'Exporting...';
        const zipBlob = await sampler.exportSlicesToZip();
        const url = URL.createObjectURL(zipBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cloudsampler_slices.zip';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        console.error('Failed to export slices:', err);
        alert('Failed to export slices ZIP.');
      } finally {
        exportBtn.disabled = false;
        exportBtn.textContent = 'DAW Export (.ZIP)';
      }
    });

    // WaveSurfer render regions
    const renderSlices = (slices) => {
      wsRegions.clearRegions();
      slices.forEach((slice, index) => {
        const hue = (index * 137.5) % 360;
        wsRegions.addRegion({
          id: slice.id,
          start: slice.start,
          end: slice.end,
          color: slice.color || `hsla(${hue}, 70%, 50%, 0.3)`,
          drag: false,
          resize: false
        });
      });
      if (slices.length > 0) {
        exportBtn.disabled = false;
      }
    };

    autoSliceBtn.addEventListener('click', () => {
      if (!sampler.buffer) {
        alert("Please load an audio buffer first.");
        return;
      }
      const slices = sampler.detectTransients(0.3);
      renderSlices(slices);
    });

    // Helper for trigger pad playback
    const startPad = (index) => {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (index < 0 || index >= padElements.length) return;
      padElements[index].classList.add('active');
      if (sampler.buffer && index < sampler.slices.length) {
        try {
          sampler.startSlice(index);
        } catch (e) {
          console.error(e);
        }
      }
    };

    const stopPad = (index) => {
      if (index < 0 || index >= padElements.length) return;
      padElements[index].classList.remove('active');
      if (sampler.buffer && index < sampler.slices.length) {
        try {
          sampler.stopSlice(index);
        } catch (e) {
          console.error(e);
        }
      }
    };

    // Pad Mouse Events
    padElements.forEach((pad, index) => {
      pad.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startPad(index);
      });
      pad.addEventListener('mouseup', (e) => {
        e.preventDefault();
        stopPad(index);
      });
      pad.addEventListener('mouseleave', (e) => {
        stopPad(index);
      });
    });

    // Keyboard Events mapping
    const keyMap = {
      'Digit1': 0, 'Numpad1': 0, '1': 0,
      'Digit2': 1, 'Numpad2': 1, '2': 1,
      'Digit3': 2, 'Numpad3': 2, '3': 2,
      'Digit4': 3, 'Numpad4': 3, '4': 3,
      'Digit5': 4, 'Numpad5': 4, '5': 4,
      'Digit6': 5, 'Numpad6': 5, '6': 5,
      'Digit7': 6, 'Numpad7': 6, '7': 6,
      'Digit8': 7, 'Numpad8': 7, '8': 7
    };

    const activeKeys = new Set();

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const targetTag = e.target.tagName.toLowerCase();
      if (targetTag === 'input' || targetTag === 'textarea' || e.target.isContentEditable) {
        return;
      }
      const padIndex = keyMap[e.code] !== undefined ? keyMap[e.code] : keyMap[e.key];
      if (padIndex !== undefined) {
        e.preventDefault();
        activeKeys.add(e.code || e.key);
        startPad(padIndex);
      }
    });

    window.addEventListener('keyup', (e) => {
      const targetTag = e.target.tagName.toLowerCase();
      if (targetTag === 'input' || targetTag === 'textarea' || e.target.isContentEditable) {
        return;
      }
      const padIndex = keyMap[e.code] !== undefined ? keyMap[e.code] : keyMap[e.key];
      if (padIndex !== undefined) {
        activeKeys.delete(e.code || e.key);
        stopPad(padIndex);
      }
    });
  </script>
</body>
</html>

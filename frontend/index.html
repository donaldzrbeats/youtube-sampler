<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudSampler</title>
  <style>
    body {
      background: #121214;
      color: #fff;
      font-family: sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel {
      width: 100%;
      max-width: 800px;
      background: #1e1e24;
      padding: 24px;
      border-radius: 8px;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    input {
      width: 70%;
      padding: 10px;
      background: #0f0f11;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
    }
    button {
      padding: 10px 16px;
      background: #00e5ff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #waveform {
      width: 100%;
      margin-top: 20px;
      background: #0f0f11;
      border-radius: 4px;
      min-height: 128px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>CloudSampler Web Studio</h2>
    <div class="controls">
      <input type="text" id="yt-url" placeholder="Paste YouTube link..." />
      <button id="load-btn">Extract Audio</button>
      <button id="auto-slice-btn">Auto Find Slices</button>
    </div>
    <div id="waveform"></div>
  </div>
  <script type="module">
    import WaveSurfer from 'wavesurfer.js';
    import RegionsPlugin from 'wavesurfer.js/plugins/regions';
    import { SamplerEngine } from '/src/sampler.js';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const sampler = new SamplerEngine(audioCtx);

    const wsRegions = RegionsPlugin.create();
    const wavesurfer = WaveSurfer.create({
      container: '#waveform',
      waveColor: '#4F4F4F',
      progressColor: '#00e5ff',
      plugins: [wsRegions]
    });

    window.wavesurfer = wavesurfer;
    window.sampler = sampler;
    window.wsRegions = wsRegions;

    const renderSlices = (slices) => {
      wsRegions.clearRegions();
      slices.forEach((slice, index) => {
        const hue = (index * 137.5) % 360;
        wsRegions.addRegion({
          id: slice.id,
          start: slice.start,
          end: slice.end,
          color: slice.color || `hsla(${hue}, 70%, 50%, 0.3)`,
          drag: false,
          resize: false
        });
      });
    };

    const autoSliceBtn = document.getElementById('auto-slice-btn');
    autoSliceBtn.addEventListener('click', () => {
      if (!sampler.buffer) {
        alert("Please load an audio buffer first.");
        return;
      }
      const slices = sampler.detectTransients(0.3);
      renderSlices(slices);
    });
  </script>
</body>
</html>

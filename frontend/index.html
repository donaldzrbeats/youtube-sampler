<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudSampler</title>
  <style>
    body {
      background: #121214;
      color: #fff;
      font-family: sans-serif;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel {
      width: 100%;
      max-width: 800px;
      background: #1e1e24;
      padding: 24px;
      border-radius: 8px;
    }
    input {
      width: 70%;
      padding: 10px;
      background: #0f0f11;
      border: 1px solid #333;
      color: #fff;
      border-radius: 4px;
    }
    button {
      padding: 10px 16px;
      background: #00e5ff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h2>CloudSampler Web Studio</h2>
    <div>
      <input type="text" id="yt-url" placeholder="Paste YouTube link..." />
      <button id="load-btn">Extract Audio</button>
    </div>
  </div>
  <script type="module" src="/src/sampler.js"></script>
</body>
</html>
